services:
  web-service:
    image: web-service:latest
    container_name: web-service
    user: root

    ports:
      - "${WEB_PORT:-8888}:80"

    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/easyaiot-proxy.conf:/etc/nginx/conf.d/easyaiot-proxy.conf:ro
      - ./logs:/app/logs
      - ./conf/ssl:/etc/nginx/ssl:ro
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Asia/Shanghai

    extra_hosts:
      - "gateway:172.18.0.1"
      - "video-host:172.18.0.1"
      - "ai-host:172.18.0.1"
      - "srs-host:172.18.0.1"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - easyaiot-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  easyaiot-network:
    name: easyaiot-network
    external: true
